{{- if .Values.storegate.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.storegate.name }}
  namespace: {{.Release.Namespace}}
  {{- if not .Values.serviceAccounts.annotationsOnlyForBasketledger }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.storegate.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.storegate.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.storegate.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.storegate.name }}
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ .Values.storegate.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      {{- if .Values.securityContext.enable }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if .Values.seccompProfile.enable }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      {{- end }}
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: {{ .Values.images.repository }}/{{ .Values.storegate.name }}:{{ .Values.images.tag | default .Chart.AppVersion }}
          ports:
          - containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-readiness-probe"
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-liveness-probe"
          env:
          - name: PORT
            value: "8080"
          - name: CATALOG_VAULT_ADDR
            value: "{{ .Values.catalogVault.name }}:3550"
          - name: FX_RATES_ADDR
            value: "{{ .Values.fxRates.name }}:7000"
          - name: BASKET_LEDGER_ADDR
            value: "{{ .Values.basketLedger.name }}:7070"
          - name: SUGGESTR_ADDR
            value: "{{ .Values.suggestrSvc.name }}:8080"
          - name: FREIGHT_QUOTE_ADDR
            value: "{{ .Values.freightQuote.name }}:50051"
          - name: ORDER_FORGE_ADDR
            value: "{{ .Values.orderForge.name }}:5050"
          - name: PROMO_BEAM_ADDR
            value: "{{ .Values.promoBeam.name }}:9555"
          - name: AIDECK_ADDR
            value: "{{ .Values.aideckSvc.name }}:80"
          - name: ENV_PLATFORM
            value: {{ .Values.storegate.platform | quote }}
          {{- if .Values.opentelemetryCollector.create }}
          - name: COLLECTOR_SERVICE_ADDR
            value: "{{ .Values.opentelemetryCollector.name }}:4317"
          - name: OTEL_SERVICE_NAME
            value: "{{ .Values.storegate.name }}"
          {{- end }}
          {{- if .Values.googleCloudOperations.tracing }}
          - name: ENABLE_TRACING
            value: "1"
          {{- end }}
          {{- if .Values.googleCloudOperations.profiler }}
          - name: ENABLE_PROFILER
            value: "1"
          {{- end }}
          - name: CYMBAL_BRANDING
            value: {{ .Values.storegate.cymbalBranding | quote }}
          - name: ENABLE_ASSISTANT
            value: {{ .Values.aideckSvc.create | quote }}
          - name: ENABLE_SINGLE_SHARED_SESSION
            value: {{ .Values.storegate.singleSharedSession | quote }}
          resources:
            {{- toYaml .Values.storegate.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.storegate.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.storegate.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.storegate.name }}
  ports:
  - name: http
    port: 80
    targetPort: 8080
{{- if .Values.storegate.externalService }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.storegate.name }}-external
  namespace: {{ .Release.Namespace }}
spec:
  type: LoadBalancer
  selector:
    app: {{ .Values.storegate.name }}
  ports:
  - name: http
    port: 80
    targetPort: 8080
{{- end }}
{{- if .Values.networkPolicies.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.storegate.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.storegate.name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- if .Values.storegate.externalService }}
  - {}
  {{- else }}
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Values.trafficMimic.name }}
    {{- if .Values.storegate.virtualService.create }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.storegate.virtualService.gateway.namespace }}
      podSelector:
        matchLabels:
          {{ .Values.storegate.virtualService.gateway.labelKey }}: {{ .Values.storegate.virtualService.gateway.labelValue }}
    {{- end }}
    ports:
     - port: 8080
       protocol: TCP
  {{- end }}
  egress:
  - {}
{{- end }}
{{- if .Values.sidecars.create }}
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: {{ .Values.storegate.name }}
  namespace: {{ .Release.Namespace }}
spec:
  workloadSelector:
    labels:
      app: {{ .Values.storegate.name }}
  egress:
  - hosts:
    - istio-system/*
    - ./{{ .Values.promoBeam.name }}.{{ .Release.Namespace }}.svc.cluster.local
    - ./{{ .Values.basketLedger.name }}.{{ .Release.Namespace }}.svc.cluster.local
    - ./{{ .Values.orderForge.name }}.{{ .Release.Namespace }}.svc.cluster.local
    - ./{{ .Values.fxRates.name }}.{{ .Release.Namespace }}.svc.cluster.local
    - ./{{ .Values.catalogVault.name }}.{{ .Release.Namespace }}.svc.cluster.local
    - ./{{ .Values.suggestrSvc.name }}.{{ .Release.Namespace }}.svc.cluster.local
    - ./{{ .Values.freightQuote.name }}.{{ .Release.Namespace }}.svc.cluster.local
    {{- if .Values.opentelemetryCollector.create }}
    - ./{{ .Values.opentelemetryCollector.name }}.{{ .Release.Namespace }}.svc.cluster.local
    {{- end }}
{{- end }}
{{- if .Values.authorizationPolicies.create }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.storegate.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.storegate.name }}
  rules:
  {{- if .Values.storegate.externalService }}
  - to:
  {{- else }}
  - from:
    - source:
        principals:
        {{- if .Values.serviceAccounts.create }}
        - cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.trafficMimic.name }}
        {{- else }}
        - cluster.local/ns/{{ .Release.Namespace }}/sa/default
        {{- end }}
        {{- if .Values.storegate.virtualService.create }}
        - cluster.local/ns/{{ .Values.storegate.virtualService.gateway.namespace }}/sa/{{ .Values.storegate.virtualService.gateway.name }}
        {{- end }}
    to:
  {{- end }}
    - operation:
        methods:
        - GET
        - POST
        ports:
        - "8080"
{{- end }}
{{- if .Values.storegate.virtualService.create }}
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.storegate.name }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- with .Values.storegate.virtualService.hosts }}
  hosts:
  {{- toYaml . | nindent 2 }}
  {{- end }}
  gateways:
  - {{ .Values.storegate.virtualService.gateway.namespace }}/{{ .Values.storegate.virtualService.gateway.name }}
  http:
  - route:
    - destination:
        host: {{ .Values.storegate.name }}
        port:
          number: 80
{{- end }}
{{- end }}
