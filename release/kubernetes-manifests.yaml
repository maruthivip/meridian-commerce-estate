apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafficmimic
  labels:
    app: trafficmimic
spec:
  selector:
    matchLabels:
      app: trafficmimic
  replicas: 1
  template:
    metadata:
      labels:
        app: trafficmimic
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: trafficmimic
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      - command:
        - /bin/sh
        - -exc
        - |
          MAX_RETRIES=12
          RETRY_INTERVAL=10
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Pinging storegate: ${STOREGATE_ADDR}..."
            STATUSCODE=$(wget --server-response http://${STOREGATE_ADDR} 2>&1 | awk '/^  HTTP/{print $2}')
            if [ $STATUSCODE -eq 200 ]; then
                echo "Storegate is reachable."
                exit 0
            fi
            echo "Error: Could not reach storegate - Status code: ${STATUSCODE}"
            sleep $RETRY_INTERVAL
          done
          echo "Failed to reach storegate after $MAX_RETRIES attempts."
          exit 1
        name: storegate-check
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        env:
        - name: STOREGATE_ADDR
          value: "storegate:80"
      containers:
      - name: main
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/trafficmimic:v0.10.7
        env:
        - name: STOREGATE_ADDR
          value: "storegate:80"
        - name: USERS
          value: "10"
        - name: RATE
          value: "1"
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
