apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderforge
  labels:
    app: orderforge
spec:
  selector:
    matchLabels:
      app: orderforge
  template:
    metadata:
      labels:
        app: orderforge
    spec:
      serviceAccountName: orderforge
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: orderforge
          ports:
          - containerPort: 5050
          readinessProbe:
            grpc:
              port: 5050
          livenessProbe:
            grpc:
              port: 5050
          env:
          - name: PORT
            value: "5050"
          - name: CATALOG_VAULT_ADDR
            value: "catalogvault:3550"
          - name: FREIGHT_QUOTE_ADDR
            value: "freightquote:50051"
          - name: PAY_GUARD_ADDR
            value: "payguard:50051"
          - name: MAIL_COURIER_ADDR
            value: "mailcourier:5000"
          - name: FX_RATES_ADDR
            value: "fxrates:7000"
          - name: BASKET_LEDGER_ADDR
            value: "basketledger:7070"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orderforge
  labels:
    app: orderforge
spec:
  type: ClusterIP
  selector:
    app: orderforge
  ports:
  - name: grpc
    port: 5050
    targetPort: 5050
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orderforge
