apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - otel-collector.yaml
patches:
# promobeam - not yet implemented
# orderforge - tracing, profiler
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: orderforge
    spec:
      template:
        spec:
          containers:
            - name: server
              env:
              - name: COLLECTOR_SERVICE_ADDR
                value: "opentelemetrycollector:4317"
              - name: OTEL_SERVICE_NAME
                value: "orderforge"
              - name: ENABLE_TRACING
                value: "1"
              - name: ENABLE_PROFILER
                value: "1"
# fxrates - tracing, profiler
